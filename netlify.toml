[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"

[functions."discord-live"]
  schedule = "* 0-3 * * 1,2,5"

[functions."discord-live-sunday-start"]
  schedule = "30-59 16 * * 0"

[functions."discord-live-sunday-day"]
  schedule = "* 17-23 * * 0"

[[headers]]
  for = "/owners/locker-personal-items.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
